[project]
name = "expra-mcp"
version = "0.1.0"
description = "Local development/debugging MCP server for the expra-engine working tree"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1"]

[project.scripts]
expra-mcp = "expra_dev_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
