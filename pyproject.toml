[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expra-engine"
dynamic = ["version"]
description = "Expra game engine and editor — founded on the proven System Analyzer coordinator architecture"
requires-python = ">=3.12"
dependencies = [
    "ttkbootstrap>=1.10",
    "pygame>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "mypy>=1.11",
    "build>=1.0",
]

[project.scripts]
expra-editor = "expra_engine.main:main"
expra-export = "expra_engine.export.cli:main"
expra-new = "expra_engine.project_cli:main"

[tool.setuptools.dynamic]
version = { attr = "expra_engine._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expra_engine = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE001"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["build"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
